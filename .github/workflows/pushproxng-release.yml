name: Build Release and Push
on:
  push:
    tags:
    - '*'
env:
  # Docker Home OIDC connection ID for .github/actions/configure-dockerhub
  # (a repository variable, not a secret).
  DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
jobs:
  build-push:
    permissions:
      contents: read
      id-token: write # Docker Hub OIDC login
    name: ${{ matrix.image }} - ${{ matrix.arch }} docker build
    runs-on: ${{ fromJSON('{"arm64":"2vcpu-ubuntu-2204-arm","amd64":"ubuntu-22.04"}')[matrix.arch] }}
    container:
      image: luthersystems/build-go:v0.0.68
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
        image:
          - pushprox
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # include tags for VERSION detection
      - name: Build container
        uses: ./.github/actions/build-docker-images
        timeout-minutes: 60 # the Docker Hub OIDC token lasts 60 minutes
        with:
          arch: ${{ matrix.arch }}
          image: .
          git_tag: $GITHUB_REF_NAME
  push-manifests:
    permissions:
      contents: read
      id-token: write # Docker Hub OIDC login
    runs-on: ubuntu-22.04
    needs:
    - build-push
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    - name:  Configure DockerHub
      uses: ./.github/actions/configure-dockerhub
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Create and push manifest for multiarch
      run:  make push-manifests GIT_TAG=$GITHUB_REF_NAME
      timeout-minutes: 60
