name: Build Docker Images
description: >-
  Build the image for one architecture on a runner of that architecture,
  check it with the build-harden kit, and push it when git_tag is set. The
  caller checks out the commit to build first (a local action cannot run
  before a checkout), so this action does not check out again: a second
  checkout would build the event's commit, not the one the caller chose.
inputs:
  arch:
    description: The platform architecture
    required: true
  image:
    description: The image to build
    required: true
  git_tag:
    description: Git release tag
    default: ''
  git_rev:
    description: Git commit hash
    default: ''

runs:
  using: composite
  steps:
    - name: Install Docker (ARM runners)
      if: runner.arch == 'ARM64'
      shell: bash
      run: |
        if command -v docker &>/dev/null; then
          echo "Docker CLI already available, skipping install"
          exit 0
        fi
        # Use sudo if available (bare-metal runner), otherwise run as root (container)
        SUDO=""
        if command -v sudo &>/dev/null; then
          SUDO="sudo"
        fi
        # Detect OS for correct Docker repo (ubuntu vs debian)
        . /etc/os-release
        $SUDO apt-get update
        $SUDO apt-get install -y ca-certificates curl gnupg make
        $SUDO install -m 0755 -d /etc/apt/keyrings
        curl -fsSL "https://download.docker.com/linux/${ID}/gpg" | $SUDO gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        $SUDO chmod a+r /etc/apt/keyrings/docker.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/${ID} ${VERSION_CODENAME} stable" | $SUDO tee /etc/apt/sources.list.d/docker.list > /dev/null
        $SUDO apt-get update
        $SUDO apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin
        $SUDO chmod 666 /var/run/docker.sock

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      with:
        platforms: linux/${{ inputs.arch }}

    # Docker Hub OIDC login, release (tag) builds only: they push. CI builds
    # only pull public images, so they pull anonymously and need no id-token.
    # Logged in last, right before the docker work, because the token expires.
    - name: Configure DockerHub
      if: inputs.git_tag != ''
      uses: ./.github/actions/configure-dockerhub

    # The inputs reach make through the environment, not through ${{ }} in
    # the script, so a tag name cannot inject shell code.
    - name: Build docker image for ${{ inputs.arch }}
      shell: bash
      env:
        IMAGE_DIR: ${{ inputs.image }}
        ARCH: ${{ inputs.arch }}
        GIT_TAG_IN: ${{ inputs.git_tag }}
        GIT_REV_IN: ${{ inputs.git_rev }}
      run: |
        cd "$IMAGE_DIR" && make PLATFORMS="linux/$ARCH" TAG_SUFFIX="-$ARCH" GIT_TAG="$GIT_TAG_IN" GIT_REVISION="$GIT_REV_IN" static

    # Check the built image before anything is pushed: the final stage must
    # run the build-harden kit last, and no distrusted root CA may be trusted
    # anywhere in the image (scripts/check-harden.sh).
    - name: Verify build-harden
      shell: bash
      env:
        IMAGE_DIR: ${{ inputs.image }}
        ARCH: ${{ inputs.arch }}
        GIT_TAG_IN: ${{ inputs.git_tag }}
        GIT_REV_IN: ${{ inputs.git_rev }}
      run: |
        cd "$IMAGE_DIR" && make PLATFORMS="linux/$ARCH" TAG_SUFFIX="-$ARCH" GIT_TAG="$GIT_TAG_IN" GIT_REVISION="$GIT_REV_IN" check-harden

    - name: Push docker image for ${{ inputs.arch }}
      if: inputs.git_tag != ''
      shell: bash
      env:
        IMAGE_DIR: ${{ inputs.image }}
        ARCH: ${{ inputs.arch }}
        GIT_TAG_IN: ${{ inputs.git_tag }}
        GIT_REV_IN: ${{ inputs.git_rev }}
      run: |
        cd "$IMAGE_DIR" && make PLATFORMS="linux/$ARCH" TAG_SUFFIX="-$ARCH" GIT_TAG="$GIT_TAG_IN" GIT_REVISION="$GIT_REV_IN" push
